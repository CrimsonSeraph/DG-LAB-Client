# DG-LAB-Client 静态资源 Worker：插件清单与应用更新清单
# 只托管 CI 生成的 public/ 目录，Cloudflare 侧不执行任何构建
# directory 相对本文件所在目录解析，CI 先写好 public/ 里的两份清单再执行 wrangler deploy
name = "dglab-registry"
compatibility_date = "2025-06-01"

[assets]
directory = "public"
# 纯静态 Worker 不能声明 assets binding，声明了 wrangler 会要求同时提供 main 脚本
